name: Submit Sitemap to Google Search Console

# Re-submits the dynamic sitemap to GSC after every deploy so new URLs get
# crawled. The legacy /ping endpoint is deprecated, so we use the Search Console
# API v3 with a service-account JWT. Runs in GitHub's environment (egress to
# googleapis.com is allowed) — unlike the build box which is firewalled off.
#
# No npm dependencies: Node's built-in crypto + fetch sign the JWT and call the
# API directly.

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Submit sitemap via GSC API
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SITE_URL: https://100tiki.com
        run: |
          node -e '
          const crypto = require("crypto");
          const sa = JSON.parse(process.env.GSC_SERVICE_ACCOUNT);
          const SITE = process.env.SITE_URL;
          const SITEMAP = SITE + "/sitemap.xml";
          const b64 = (b) => Buffer.from(b).toString("base64").replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
          function jwt() {
            const header = {alg:"RS256", typ:"JWT"};
            const now = Math.floor(Date.now()/1000);
            const claim = {iss: sa.client_email, scope:"https://www.googleapis.com/auth/webmasters", aud:"https://oauth2.googleapis.com/token", iat: now, exp: now+3300};
            const seg = b64(JSON.stringify(header)) + "." + b64(JSON.stringify(claim));
            const sig = crypto.createSign("RSA-SHA256").update(seg).sign(sa.private_key,"base64");
            return seg + "." + sig.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
          }
          (async () => {
            const tok = await (await fetch("https://oauth2.googleapis.com/token", {
              method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
              body: new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: jwt()})
            })).json();
            const token = tok.access_token;
            const site = "sc-domain:100tiki.com";
            const url = `https://searchconsole.googleapis.com/webmasters/v3/sites/${encodeURIComponent(site)}/sitemaps/${encodeURIComponent(SITEMAP)}`;
            const res = await fetch(url, {method:"PUT", headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"}, body: JSON.stringify({})});
            if (!res.ok) { console.error("submit failed", res.status, await res.text()); process.exit(1); }
            console.log("Submitted", SITEMAP, "to", site);
          })().catch(e => { console.error(e); process.exit(1); });
          '
